<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#192d3a">
  <title>Task Harbor · 自动化任务管理</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/editor.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#tasks"><span class="brand-icon">H</span><span>Task Harbor<small>自动化任务管理</small></span></a>
    <div class="nav-label">工作空间</div>
    <nav aria-label="主导航">
      <a href="#tasks" data-page="tasks"><span>▦</span>任务管理</a>
      <a href="#runs" data-page="runs"><span>◷</span>执行记录</a>
      <a href="#settings" data-page="settings"><span>⚙</span>全局配置</a>
      <a href="#environment" data-page="environment"><span>⌘</span>运行环境</a>
    </nav>
    <div class="sidebar-footer"><i id="connection-dot"></i><span id="connection">正在连接</span><small>LOCAL WORKSPACE</small></div>
  </aside>
  <main>
    <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong id="page-name">任务管理</strong></div><div class="topbar-right"><span class="local-pill">本地运行</span><time id="clock"></time></div></header>
    <div id="content" class="content" aria-live="polite"></div>
  </main>
  <dialog id="task-dialog" class="dialog wide">
    <form id="task-form">
      <div class="dialog-heading"><div><span class="eyebrow">TASK CONFIGURATION</span><h2 id="task-title">新建任务</h2></div><button type="button" class="icon-button" data-close="task-dialog" aria-label="关闭">×</button></div>
      <div class="form-grid">
        <label>任务名称<input name="name" required maxlength="120" placeholder="例如：每日签到"></label>
        <label>任务 ID<input name="id" required pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}" placeholder="daily-checkin"></label>
        <label class="full">描述<input name="description" maxlength="1000" placeholder="这个任务需要完成什么"></label>
        <label>执行频率<select name="kind"><option value="manual">仅手动运行</option><option value="daily">每天</option><option value="weekly">每周</option><option value="interval">固定间隔</option><option value="cron">Cron 表达式</option></select></label>
        <label>任务时区<input name="timezone" required value="Asia/Shanghai"></label>
        <label data-frequency="daily weekly">执行时间<input name="time" type="time" value="09:00"></label>
        <label data-frequency="interval">间隔（分钟）<input name="interval_minutes" type="number" min="1" max="525600" value="1440"></label>
        <label data-frequency="cron">Cron（五段）<input name="cron" value="0 9 * * *"></label>
        <fieldset class="full weekdays" data-frequency="weekly"><legend>执行日期</legend><label><input type="checkbox" name="weekday" value="0">一</label><label><input type="checkbox" name="weekday" value="1">二</label><label><input type="checkbox" name="weekday" value="2">三</label><label><input type="checkbox" name="weekday" value="3">四</label><label><input type="checkbox" name="weekday" value="4">五</label><label><input type="checkbox" name="weekday" value="5">六</label><label><input type="checkbox" name="weekday" value="6">日</label></fieldset>
        <label>超时（秒）<input name="timeout_seconds" type="number" min="1" max="86400" value="120" required></label>
        <label>最多尝试次数<input name="max_attempts" type="number" min="1" max="5" value="1" required></label>
        <label>资源组<input name="resource_group" placeholder="同一资源组的任务串行运行"></label>
        <label>工作目录<input name="cwd" required value="tasks/example"></label>
        <label class="full">启动命令（JSON 参数数组）<textarea name="command" rows="2" required>["{python}", "main.py"]</textarea><small>{python} 自动使用当前 venv。填写 tasks/任务ID 可自动创建目录，再通过「脚本」编写代码。</small></label>
        <label class="full">传入的环境变量名称<input name="env_names" placeholder="例如 WORKBUDDY_ACCESS_TOKEN, WORKBUDDY_USER_ID"><small>变量值在「运行环境」中单独设置。</small></label>
        <label class="checkbox-label"><input name="enabled" type="checkbox">开启定时执行</label>
        <label class="checkbox-label"><input name="daily_once" type="checkbox">每天成功后跳过重复执行</label>
      </div>
      <div class="dialog-footer"><button type="button" class="button" data-close="task-dialog">取消</button><button class="button primary" type="submit">保存任务</button></div>
    </form>
  </dialog>
  <dialog id="log-dialog" class="dialog log-dialog"><div class="dialog-heading"><div><span class="eyebrow">EXECUTION DETAIL</span><h2 id="log-title">执行日志</h2></div><button class="icon-button" data-close="log-dialog" aria-label="关闭">×</button></div><div id="log-meta"></div><pre id="log-output"></pre><div class="dialog-footer"><button class="button" id="copy-log">复制日志</button><button class="button danger" id="stop-log">停止执行</button><button class="button" data-close="log-dialog">关闭</button></div></dialog>
  <dialog id="login-dialog" class="dialog"><form id="login-form"><div class="dialog-heading"><div><span class="eyebrow">WORKSPACE ACCESS</span><h2>进入工作空间</h2></div></div><label>管理访问密钥<input name="token" type="password" required autocomplete="current-password"></label><div class="dialog-footer"><button class="button primary">登录</button></div></form></dialog>
  <dialog id="source-dialog" class="dialog wide"><form id="source-form"><div class="dialog-heading"><div><span class="eyebrow">PLUGIN SOURCE</span><h2 id="source-title">编辑脚本</h2></div><button type="button" class="icon-button" data-close="source-dialog" aria-label="关闭">×</button></div><label>已有脚本<select id="source-files"></select></label><label>文件路径<input id="source-path" required value="main.py"></label><label>脚本内容<textarea id="source-content" rows="18" spellcheck="false" required></textarea><small>保存前会备份旧版本；Python 脚本进行语法检查。正在运行或排队时需先停止任务。</small></label><div class="dialog-footer"><button type="button" class="button" data-close="source-dialog">取消</button><button class="button primary" type="submit">保存脚本</button></div></form></dialog>
  <div id="toasts" aria-live="assertive"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
